<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eef3f5" />
  <title>금천 한끼</title>
  <meta name="description" content="금천구청과 동주민센터 근무자를 위한 점심 후보 추천 MVP" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="./" aria-label="금천 한끼 홈">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>금천 한끼</span>
      </a>
      <div class="header-note">금천구 점심 선택기 <span>MVP</span></div>
    </header>

    <main class="workspace">
      <aside class="filter-card" aria-label="점심 검색 조건">
        <div class="intro">
          <p class="section-kicker">TODAY'S LUNCH</p>
          <h1>근무지 주변에서<br />점심 후보를 찾아보세요.</h1>
          <p>위치와 메뉴, 거리만 고르면 세 곳을 보여드립니다.</p>
        </div>

        <div class="field-block">
          <label class="field-label" for="workplace">근무지</label>
          <div class="select-wrap">
            <select id="workplace" aria-label="근무지 선택">
              <option>근무지 불러오는 중…</option>
            </select>
            <span class="select-arrow" aria-hidden="true"></span>
          </div>
          <p id="workplaceAddress" class="field-help"></p>
        </div>

        <div class="field-block">
          <div class="field-title-row">
            <span class="field-label">메뉴</span>
            <span class="field-help inline">복수 선택 가능</span>
          </div>
          <div id="menuGroup" class="menu-grid" role="group" aria-label="메뉴 선택">
            <button class="menu-chip active" type="button" data-menu="all">전체</button>
            <button class="menu-chip" type="button" data-menu="korean">한식</button>
            <button class="menu-chip" type="button" data-menu="chinese">중식</button>
            <button class="menu-chip" type="button" data-menu="japanese">일식</button>
            <button class="menu-chip" type="button" data-menu="western">양식</button>
            <button class="menu-chip" type="button" data-menu="bunsik">분식</button>
          </div>
          <p id="menuSummary" class="field-help">모든 음식점을 후보에 포함합니다.</p>
        </div>

        <div class="field-block">
          <span class="field-label">검색 거리</span>
          <div id="distanceGroup" class="segment" role="group" aria-label="거리 선택">
            <button type="button" data-radius="300">300m</button>
            <button type="button" data-radius="500" class="active">500m</button>
            <button type="button" data-radius="1000">1km</button>
          </div>
        </div>

        <button id="searchBtn" class="primary-button" type="button">
          <span>점심 룰렛 돌리기</span>
          <span class="button-symbol" aria-hidden="true">↻</span>
        </button>

        <div id="status" class="status" aria-live="polite"></div>
        <div id="demoBadge" class="demo-badge hidden">현재 데모 데이터로 표시 중</div>
      </aside>

      <section class="results-area" aria-label="추천 결과">
        <div class="results-head">
          <div>
            <p class="section-kicker">LUNCH ROULETTE</p>
            <h2>오늘 뭐 먹지?</h2>
          </div>
          <button id="againBtn" class="ghost-button hidden" type="button">다시 돌리기 ↻</button>
        </div>

        <div id="emptyState" class="empty-state">
          <div class="empty-index" aria-hidden="true">↻</div>
          <h3>점심 룰렛을 돌려보세요.</h3>
          <p>왼쪽에서 근무지와 메뉴를 선택한 뒤<br class="desktop-only" /> 점심 후보를 찾아보세요.</p>
        </div>

        <div id="resultSummary" class="result-summary hidden"></div>
        <div id="results" class="result-grid" aria-live="polite"></div>
        <div id="finalPick" class="final-pick hidden" aria-live="polite"></div>
        <div id="rouletteActions" class="roulette-actions hidden">
          <button id="pickOneBtn" class="pick-one-button" type="button">딱 한 곳 골라줘!</button>
        </div>
      </section>
    </main>

    <footer>
      <span>금천구 근무자를 위한 점심 선택 MVP</span>
      <span>장소 데이터: Kakao Maps API</span>
    </footer>
  </div>

  <script src="./config.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
